# ============================================================
# .github/workflows/monitor.yml
#
# Este arquivo diz ao GitHub quando e como rodar o bot.
# O GitHub vai executar isso automaticamente na nuvem, de graça.
# ============================================================

name: 🤖 Monitor de Preços

on:
  schedule:
    # Roda a cada 1 hora (formato cron: minuto hora * * *)
    # Para mudar: https://crontab.guru
    - cron: '0 * * * *'

  # Permite rodar manualmente pelo painel do GitHub (Actions > Run workflow)
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest  # Máquina virtual Linux gratuita do GitHub

    # Permissão para salvar o histórico de volta no repositório
    permissions:
      contents: write

    steps:
      # 1. Baixa o código do repositório
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as dependências
      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      # 4. Roda o bot (usa as credenciais salvas nos Secrets do GitHub)
      - name: 🚀 Executar bot
        env:
          EMAIL_REMETENTE:    ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA:        ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python run_once.py

      # 5. Salva o histórico de preços de volta no repositório
      - name: 💾 Salvar histórico de preços
        run: |
          git config --global user.name  "Price Bot 🤖"
          git config --global user.email "bot@pricebot.com"
          git add historico_precos.csv
          git diff --staged --quiet || git commit -m "📊 Atualização de preços - $(date '+%d/%m/%Y %H:%M')"
          git push
