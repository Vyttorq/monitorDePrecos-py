name: 🤖 Monitor de Preços

on:
  schedule:
    - cron: '0 * * * *'  # A cada 1 hora
  workflow_dispatch:      # Permite rodar manualmente

jobs:
  monitorar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🚀 Executar bot
        env:
          EMAIL_REMETENTE:    ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA:        ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python run_once.py

      - name: 💾 Salvar histórico de preços
        run: |
          git config --global user.name  "Price Bot 🤖"
          git config --global user.email "bot@pricebot.com"
          if [ -f historico_precos.csv ]; then
            git add historico_precos.csv
            git diff --staged --quiet || git commit -m "📊 Atualização de preços - $(date '+%d/%m/%Y %H:%M')"
            git push
          else
            echo "Nenhum dado coletado, pulando commit."
          fi
